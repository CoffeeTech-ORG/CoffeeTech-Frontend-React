<div class="page-header">
  <h1>Divisiones</h1>
</div>

<div class="content-container">
  <div class="table-operations">
    <nz-input-group [nzSuffix]="suffixIcon">
      <input
        type="text"
        nz-input
        placeholder="Buscar división"
        [(ngModel)]="searchValue"
        (ngModelChange)="search()"
      />
    </nz-input-group>
    <ng-template #suffixIcon>
      <button nz-button nzType="text" (click)="reset()">
        <span nz-icon nzType="reload"></span>
      </button>
    </ng-template>
  </div>

  <nz-table
    #basicTable
    [nzData]="divisions"
    [nzLoading]="loading"
    [nzPageSize]="10"
    nzShowSizeChanger
    class="table-striped-rows"
  >
    <thead>
      <tr>
        <th>División</th>
        <th>División Superior</th>
        <th>Colaboradores</th>
        <th>Nivel</th>
        <th>Subdivisiones</th>
        <th>Embajadores</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let data of basicTable.data">
        <td>{{ data.name }}</td>
        <td>{{ data.superiorDivision }}</td>
        <td>{{ data.collaborators }}</td>
        <td>{{ data.level }}</td>
        <td>{{ data.subdivisions }}</td>
        <td>{{ data.ambassador }}</td>
      </tr>
    </tbody>
  </nz-table>
</div>
